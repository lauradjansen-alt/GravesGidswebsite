<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GravesGids · informatie, steun en houvast bij de ziekte van Graves</title>
<meta name="description" content="GravesGids: informatie, steun en houvast voor mensen met de ziekte van Graves. De website komt binnenkort. Volg ons op Instagram en Facebook.">
<link rel="icon" href="favicon.png">
<style>
@font-face{font-family:"Fraunces";src:url(fonts/fraunces-latin-500-statisch.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"Atkinson";src:url(fonts/atkinson-hyperlegible-next-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson";src:url(fonts/atkinson-hyperlegible-next-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{--zand:#F8F2E9;--inkt:#2B3A55;--zacht:#56647C;--merk:#1C5AA2;--blauw:#1268B8;--teal:#0A93A2}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--zand);color:var(--inkt);font:400 clamp(17px,1.45vw,21px)/1.6 "Atkinson",system-ui,sans-serif;-webkit-text-size-adjust:100%;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--merk)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,4vw,56px)}
.nav .logo{height:42px;display:block}
.nav .rechts{display:flex;align-items:center;gap:20px;font-weight:600;font-size:16px}
.nav .rechts a{color:var(--inkt);text-decoration:none;display:flex}
.nav .rechts a.contact{color:var(--merk)}
.nav svg{width:20px;height:20px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:40px clamp(24px,6vw,96px);background:url(achtergrond.jpg) center/cover no-repeat}
h1{font-family:"Fraunces",Georgia,serif;font-weight:500;color:var(--merk);line-height:1.12;margin:0;
  font-size:clamp(34px,min(5.6vw,8vh),76px)}
.lijn{display:block;width:64px;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--blauw),var(--teal));margin:clamp(22px,4vh,40px) auto}
main p{margin:0;max-width:44em}
main p + p{margin-top:12px}
.volg{margin-top:clamp(32px,6vh,60px);font-size:.9em}
.knoppen{display:flex;justify-content:center;gap:18px;margin-top:14px}
/* computer: knoppen met kleurverloop (B) */
.knoppen a{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:600;font-size:16px;color:#fff;
  padding:11px 24px;border-radius:30px;background:linear-gradient(100deg,var(--blauw),var(--teal));box-shadow:0 3px 12px rgba(10,147,162,.22);transition:transform .15s,box-shadow .15s}
.knoppen a:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(10,147,162,.32)}
.knoppen svg{width:19px;height:19px}
footer{padding:14px clamp(20px,4vw,56px);font-size:14px;color:var(--zacht);display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px;text-align:center}
footer a{font-weight:600}
@media (max-width:760px){
  body{font-size:17px}
  h1{text-wrap:balance}
  main p{text-wrap:balance}
  .nav{padding:14px 20px}
  .nav .logo{height:34px}
  .nav .rechts{gap:16px}
  .lijn{margin:22px auto}
  .volg{margin-top:36px}
}
@media (max-height:640px){.lijn{margin:18px auto}.volg{margin-top:28px}main{padding:24px 24px}}
/* telefoon: ronde icoontjes (C) */
@media (max-width:760px){
  .knoppen{gap:34px}
  .knoppen a{flex-direction:column;gap:8px;font-size:15px;color:var(--merk);padding:0;background:none;box-shadow:none}
  .knoppen a:hover{transform:none;box-shadow:none}
  .knoppen svg{width:24px;height:24px;box-sizing:content-box;padding:16px;border-radius:50%;color:#fff;background:linear-gradient(135deg,var(--blauw),var(--teal));box-shadow:0 3px 12px rgba(10,147,162,.25)}
}
</style>
</head>
<body>
<header class="nav">
  <img class="logo" src="logo.png" alt="GravesGids">
  <nav class="rechts">
    <a href="https://www.instagram.com/gravesgids/" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
    <a href="https://www.facebook.com/GravesGids" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v7h4v-7H16l.5-4h-3V8.8c0-.5.3-.8.5-.8z"/></svg></a>
    <a class="contact" href="mailto:gravesgids@gmail.com">Contact</a>
  </nav>
</header>

<main>
  <h1>Goed op weg met Graves</h1>
  <span class="lijn"></span>
  <p>Informatie, steun en houvast voor mensen met de ziekte van Graves.</p>
  <p>Binnenkort vind je hier de gids, praktische handvatten en de weg naar lotgenoten.</p>
  <div class="volg">Volg ons alvast:</div>
  <div class="knoppen">
    <a href="https://www.instagram.com/gravesgids/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span>Instagram</span></a>
    <a href="https://www.facebook.com/GravesGids"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v7h4v-7H16l.5-4h-3V8.8c0-.5.3-.8.5-.8z"/></svg><span>Facebook</span></a>
  </div>
</main>

<footer>
  <span>Lotgenoten: <a href="https://www.facebook.com/groups/graveslotgenoten/">onze Facebookgroep</a></span>
  <span>Meer over Graves: <a href="https://www.ziektevangraves-basedow.nl">ziektevangraves-basedow.nl</a></span>
</footer>
</body>
</html>
